name: Historical Self Discovery

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/gapradar/discovery.py'
      - 'src/gapradar/reaction.py'
      - 'src/gapradar/routing.py'
      - 'data/backtest/medium-events.json'
      - 'tests/test_discovery.py'
      - 'tests/test_dossier.py'
      - '.github/workflows/discovery.yml'

permissions:
  contents: read

jobs:
  scout:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - name: Unit tests
        run: pytest tests/test_discovery.py tests/test_dossier.py tests/test_reaction.py
      - name: Headline self-discovery smoke replay
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m gapradar.discovery --as-of 2022-12-31 --output data/backtest/report-discovery.json
      - name: Medium-event self-discovery replay
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m gapradar.discovery --fixture data/backtest/medium-events.json --output data/backtest/report-discovery-medium.json
      - name: Print discovery reports
        if: always()
        run: |
          cat data/backtest/report-discovery.json || true
          cat data/backtest/report-discovery-medium.json || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: historical-self-discovery-reports
          path: |
            data/backtest/report-discovery.json
            data/backtest/report-discovery-medium.json
          if-no-files-found: warn
