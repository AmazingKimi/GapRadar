name: Historical Backtest

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/gapradar/backtest.py'
      - 'src/gapradar/detector.py'
      - 'data/backtest/**'
      - 'tests/test_backtest.py'
      - '.github/workflows/backtest.yml'

permissions:
  contents: read

jobs:
  replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - name: Deterministic historical benchmark
        run: gapradar backtest --mode fixture --output data/backtest/report-fixture.json
      - name: Wayback replay
        run: gapradar backtest --mode wayback --output data/backtest/report-wayback.json
      - uses: actions/upload-artifact@v4
        with:
          name: historical-backtest-reports
          path: data/backtest/report-*.json
