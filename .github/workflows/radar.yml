name: Continuous Market Radar

on:
  workflow_dispatch:
  schedule:
    - cron: '17 1,7,13,19 * * *'
  push:
    branches: [main]
    paths:
      - 'src/gapradar/**'
      - 'config/sources.yml'
      - 'config/world_sources.yml'
      - '.github/workflows/radar.yml'

permissions:
  contents: write

concurrency:
  group: gapradar-live-scan
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -e .
      - name: Compile dashboard renderer and runtime
        run: python -m py_compile src/gapradar/render.py src/gapradar/dashboard_runtime.py src/gapradar/strip_legacy_runtime.py
      - name: Scan world news and industry changes
        run: python -m gapradar.cli world-scan
      - name: Deep-dive world leads into supply and gap assessments
        run: |
          python - <<'PY'
          from pathlib import Path
          from gapradar.worldscan import load_candidates
          from gapradar.worlddeep import analyze_candidates, save_assessments
          from gapradar.newsupply import enrich_failed_assessments
          candidates = load_candidates(Path('data/world-gaps.json'))
          assessments = enrich_failed_assessments(candidates, analyze_candidates(candidates))
          save_assessments(Path('data/world-assessments.json'), assessments)
          print(f'Deep-dived {len(assessments)} world lead(s).')
          PY
      - name: Probe official sources
        run: python -m gapradar.cli doctor
      - name: Scan live first-party sources
        run: python -m gapradar.cli scan
      - name: Collect supporting reaction evidence
        run: python -m gapradar.cli validate-demand
      - name: Map replacement supply independently of reaction
        run: python -m gapradar.cli validate-supply
      - name: Build verified-event dossiers
        run: python -m gapradar.cli build-dossiers
      - name: Export live opportunity board from current source
        run: |
          python -m gapradar.cli export
          python -m gapradar.strip_legacy_runtime
          python -m gapradar.dashboard_runtime
      - name: Verify functional dashboard contract
        run: |
          grep -q 'gapradar-runtime-v5' docs/index.html
          grep -q 'Find the next opportunity' docs/index.html
          grep -q 'View today’s opportunities' docs/index.html
          grep -q 'Browse sector radar' docs/index.html
          grep -q 'Important Global Changes' docs/index.html
          grep -q 'Items scanned today' docs/index.html
          grep -q 'Regulation' docs/index.html
          grep -q 'Consumer' docs/index.html
          grep -q '中文 ✓  |  EN' docs/index.html
          grep -q 'Dark ✓  |  Light' docs/index.html
          grep -q 'width:calc(100vw - 230px)' docs/index.html
          grep -q '@media(max-width:640px)' docs/index.html
          grep -q '.actions{display:grid' docs/index.html
          grep -q '.stats{grid-template-columns:repeat(2' docs/index.html
          grep -q '.filters{width:100%' docs/index.html
          grep -q 'Automatic scan every 6 hours' docs/index.html
          if grep -q 'gapradar-runtime-v4' docs/index.html || grep -q 'gapradar-runtime-v3' docs/index.html || grep -q 'gapradar-runtime-v2' docs/index.html; then
            echo 'Stale runtime detected after export.'
            exit 1
          fi
          if grep -q 'var r=document.documentElement,l=document.getElementById' docs/index.html; then
            echo 'Legacy inline controller still present; double-toggle bug would return.'
            exit 1
          fi
      - name: Commit radar state
        run: |
          if git diff --quiet -- data/world-gaps.json data/world-assessments.json data/world-scan-stats.json data/events.json data/source-health.json data/dossiers.json docs/index.html docs/dossiers; then
            echo "No radar changes."
            exit 0
          fi
          git config user.name "gapradar-bot"
          git config user.email "gapradar-bot@users.noreply.github.com"
          git add data/world-gaps.json data/world-assessments.json data/world-scan-stats.json data/events.json data/source-health.json data/dossiers.json docs/index.html docs/dossiers
          git commit -m "data: refresh continuous market radar"
          git pull --rebase origin main
          git push origin HEAD:main
