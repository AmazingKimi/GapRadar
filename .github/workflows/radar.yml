name: Daily Radar

on:
  workflow_dispatch:
  schedule:
    - cron: '17 1 * * *'
  push:
    branches: [main]
    paths:
      - 'src/gapradar/**'
      - 'config/sources.yml'
      - '.github/workflows/radar.yml'

permissions:
  contents: write

concurrency:
  group: gapradar-live-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -e .
      - name: Scan live first-party sources
        run: gapradar scan
      - name: Export dashboard
        run: gapradar export
      - name: Commit radar state
        run: |
          if git diff --quiet -- data/events.json docs/index.html; then
            echo "No radar changes."
            exit 0
          fi
          git config user.name "gapradar-bot"
          git config user.email "gapradar-bot@users.noreply.github.com"
          git add data/events.json docs/index.html
          git commit -m "data: update verified market events"
          git push
