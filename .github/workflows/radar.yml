name: Continuous Market Radar

on:
  workflow_dispatch:
  schedule:
    - cron: '17 1,7,13,19 * * *'
  push:
    branches: [main]
    paths:
      - 'src/gapradar/**'
      - 'config/sources.yml'
      - 'config/world_sources.yml'
      - '.github/workflows/radar.yml'

permissions:
  contents: write

concurrency:
  group: gapradar-live-scan
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -e .
      - name: Scan world news and industry changes
        run: gapradar world-scan
      - name: Deep-dive world leads into supply and gap assessments
        run: |
          python - <<'PY'
          from pathlib import Path
          from gapradar.worldscan import load_candidates
          from gapradar.worlddeep import analyze_candidates, save_assessments
          from gapradar.newsupply import enrich_failed_assessments
          candidates = load_candidates(Path('data/world-gaps.json'))
          assessments = enrich_failed_assessments(candidates, analyze_candidates(candidates))
          save_assessments(Path('data/world-assessments.json'), assessments)
          print(f'Deep-dived {len(assessments)} world lead(s).')
          PY
      - name: Probe official sources
        run: gapradar doctor
      - name: Scan live first-party sources
        run: gapradar scan
      - name: Collect supporting reaction evidence
        run: gapradar validate-demand
      - name: Map replacement supply independently of reaction
        run: gapradar validate-supply
      - name: Build verified-event dossiers
        run: gapradar build-dossiers
      - name: Export live opportunity board
        run: gapradar export
      - name: Commit radar state
        run: |
          if git diff --quiet -- data/world-gaps.json data/world-assessments.json data/world-scan-stats.json data/events.json data/source-health.json data/dossiers.json docs/index.html docs/dossiers; then
            echo "No radar changes."
            exit 0
          fi
          git config user.name "gapradar-bot"
          git config user.email "gapradar-bot@users.noreply.github.com"
          git add data/world-gaps.json data/world-assessments.json data/world-scan-stats.json data/events.json data/source-health.json data/dossiers.json docs/index.html docs/dossiers
          git commit -m "data: refresh continuous market radar"
          git pull --rebase origin main
          git push origin HEAD:main
