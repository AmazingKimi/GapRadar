name: Daily Radar

on:
  workflow_dispatch:
  schedule:
    - cron: '17 1 * * *'
  push:
    branches: [main]
    paths:
      - 'src/gapradar/**'
      - 'config/sources.yml'
      - 'config/world_sources.yml'
      - '.github/workflows/radar.yml'

permissions:
  contents: write

concurrency:
  group: gapradar-live-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -e .
      - name: Scan world news and industry changes
        run: gapradar world-scan
      - name: Probe official sources
        run: gapradar doctor
      - name: Scan live first-party sources
        run: gapradar scan
      - name: Gather supporting demand evidence
        run: gapradar validate-demand
      - name: Validate replacement supply
        run: gapradar validate-supply
      - name: Build opportunity dossiers
        run: gapradar build-dossiers
      - name: Export Today Opportunity Board
        run: gapradar export
      - name: Commit radar state
        run: |
          if git diff --quiet -- data/world-gaps.json data/events.json data/source-health.json data/dossiers.json docs/index.html docs/dossiers; then
            echo "No radar changes."
            exit 0
          fi
          git config user.name "gapradar-bot"
          git config user.email "gapradar-bot@users.noreply.github.com"
          git add data/world-gaps.json data/events.json data/source-health.json data/dossiers.json docs/index.html docs/dossiers
          git commit -m "data: update today's market gap board"
          git pull --rebase origin main
          git push origin HEAD:main
