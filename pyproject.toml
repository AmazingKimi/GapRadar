[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "gapradar"
version = "0.8.0"
description = "Discover structural world changes, verify first-party facts, test displaced-demand hypotheses, map supply, and surface auditable market gaps."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "AmazingKimi" }]
dependencies = [
  "httpx>=0.27,<1",
  "feedparser>=6.0.11,<7",
  "pydantic>=2.8,<3",
  "PyYAML>=6.0,<7",
  "typer>=0.12,<1",
  "rich>=13.7,<14"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2,<9",
  "pytest-cov>=5,<6"
]

[project.scripts]
gapradar = "gapradar.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/gapradar"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
