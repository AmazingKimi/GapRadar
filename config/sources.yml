# V0.1 only accepts first-party feeds. Community sources belong to later
# reaction/supply stages and must never verify an event by themselves.
sources:
  - name: GitHub
    vendor: GitHub
    url: https://github.blog/changelog/feed/
    allowed_domains:
      - github.blog
      - github.com

  - name: Cloudflare
    vendor: Cloudflare
    url: https://blog.cloudflare.com/rss/
    allowed_domains:
      - blog.cloudflare.com
      - cloudflare.com
